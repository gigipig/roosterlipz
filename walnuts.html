<html>
<head>
  <title>Age of Baloosta</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: auto;
      font-family: "Comic Sans MS", "Comic Sans", Arial, sans-serif;
    }

    .map-arabia {
      position: relative;
      min-width: 4000px;
      min-height: 4000px;
      background-image: url("images/aoe textures/MAP000.BMP");
      background-position: top left;
      background-size: contain;
      background-repeat: no-repeat;
    }

    .page-header {
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      padding: 24px 12px 6px;
      background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.15), rgba(0,0,0,0));
      font-weight: 800;
      font-size: 48px;
    }

    .subtitle {
      text-align: center;
      color: #e6f7ff;
      margin: 0 0 12px 0;
      font-size: 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .nav {
      text-align: center;
      margin: 12px 0 24px 0;
    }

    .nav a {
      display: inline-block;
      margin: 0 8px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.75);
      color: #87CEFA;
      text-decoration: none;
      border: 1px solid #000;
      border-radius: 4px;
      font-weight: 700;
    }

    .battlefield {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 180px);
    }

    .unit, .structure, .landmark, .terrain {
      position: absolute;
      image-rendering: pixelated;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    }

    /* Left army (Blue) */
    .side-blue .badge {
      position: absolute;
      left: 500px;
      top: 200px;
      background: rgba(0, 40, 120, 0.75);
      color: #e6f7ff;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    /* Right army (Red) */
    .side-red .badge {
      position: absolute;
      left: 2900px;
      top: 200px;
      background: rgba(140, 0, 0, 0.78);
      color: #ffdddd;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    /* Strategic placements - using pixel coordinates for large map */
    .villager { left: 1200px; top: 1200px; width: 80px; }
    .outpost  { left: 3100px; top: 600px; width: 120px; }
    .ocean    { left: 400px; top: 1800px; width: 200px; opacity: 0.9; }

    .teutonic { width: 110px; left: 2800px; top: 1400px; }
    .catapult { left: 2800px; top: 600px; width: 450px; }
    .frantic  { left: 2500px; top: 720px; width: 90px; }
    .paladin  { width: 160px; }
    .paladin-hue { filter: hue-rotate(180deg) saturate(1.5) drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }

    .face-left {
      transform: scaleX(-1);
      transform-origin: center center;
    }

    .temple   { left: 1800px; top: 800px; width: 260px; }

    .legend {
      position: absolute;
      left: 1600px;
      bottom: 50px;
      background: rgba(0,0,0,0.65);
      color: #eaeaea;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    /* Soundscape HUD */
    .soundscape {
      position: fixed;
      left: 12px;
      bottom: 12px;
      background: rgba(0,0,0,0.6);
      color: #d9f0ff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      max-width: 40vw;
      line-height: 1.4;
    }

    .soundscape .now {
      color: #fff;
      font-weight: 700;
    }

    .alienmode {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      background: url("images/aoe textures/alienmode.jpg") center center / cover no-repeat;
    }

    .alienmode.show {
      opacity: 1;
    }

    /* ── BG Audio Toggle ── */
    #bgAudioToggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(135, 206, 250, 0.45);
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
      font-family: "Comic Sans MS", "Comic Sans", Arial, sans-serif;
      font-size: 11px;
      color: #87CEFA;
      letter-spacing: 1px;
      user-select: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    #bgAudioToggle:hover {
      background: rgba(135, 206, 250, 0.15);
      border-color: #87CEFA;
    }
    #bgAudioToggle.muted {
      color: #555;
      border-color: rgba(135, 206, 250, 0.2);
    }
  </style>
</head>
<body>
  <div class="map-arabia">
    <div class="page-header">Age of Baloosta</div>
    <div class="subtitle">Skirmish on Arabia — units muster at dawn</div>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="locker.html">Locker</a>
    </div>

    <div class="battlefield">
      <div class="side-blue">
        <img class="unit villager" src="images/New 2025/Villager.gif" alt="Villager">
        <img class="structure outpost" src="images/New 2025/Outpost.gif" alt="Outpost">
        <img class="terrain ocean" src="images/New 2025/Ocean.gif" alt="Shoreline">
      </div>

      <div class="side-red">
        <img class="unit teutonic" id="teutonic" src="images/New 2025/Teutonic_Knight_cometh.gif" alt="Teutonic Knight">
        <img class="unit catapult" src="images/New 2025/Catapault2.gif" alt="Catapult">
        <img class="unit frantic" src="images/New 2025/Frantic.gif" alt="Frantic">

      <img class="landmark temple" src="images/New 2025/AztecTemple.webp" alt="Aztec Temple">

  <div class="soundscape" id="soundscape">
    <div>Soundscape: goon2025/Sounds</div>
    <div>Files: <span id="sound-count">0</span></div>
    <div>Mode: <span id="mode">peaceful</span></div>
    <div>Now: <span class="now" id="now-playing">—</span></div>
  </div>

  <div class="alienmode" id="alienmode"></div>

  <!-- BG music tracks — add more <audio> elements here as needed -->
  <audio id="bgT0" preload="none"><source src="sounds/bg_track_fixed.webm" type="audio/webm"></audio>
  <audio id="bgT1" preload="none"><source src="sounds/bg_track2_fixed.webm" type="audio/webm"></audio>
  <button id="bgAudioToggle" title="Toggle background music">♪ BG</button>

  <script>
    (function () {
      var battlefield = document.querySelector('.battlefield');
      if (!battlefield) return;

      var actors = [];
      var lastTs = 0;
      var mouse = { x: 0, y: 0 };
      var battlefieldRect = battlefield.getBoundingClientRect();

      function refreshRect() {
        battlefieldRect = battlefield.getBoundingClientRect();
      }

      window.addEventListener('resize', refreshRect);
      window.addEventListener('scroll', refreshRect, true);

      document.addEventListener('mousemove', function(e) {
        var rect = battlefield.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      class BattlefieldActor {
        constructor(options) {
          options = options || {};
          this.type = options.type || 'unit';
          this.followMouse = !!options.followMouse;
          this.speed = typeof options.speed === 'number' ? options.speed : 80;
          this.hue = typeof options.hue === 'number' ? options.hue : null;
          this.el = options.el || document.createElement('img');

          if (!options.el) {
            this.el.className = options.className || 'unit';
            this.el.alt = options.alt || this.type;
            if (options.src) this.el.src = options.src;
            battlefield.appendChild(this.el);
          } else if (!options.keepParent && this.el.parentNode !== battlefield) {
            battlefield.appendChild(this.el);
          }

          this.el.style.position = 'absolute';

          this.props = this.buildProps(options.props);
          this.width = options.width || this.el.width || this.el.naturalWidth || 120;
          this.height = options.height || this.el.height || this.el.naturalHeight || 120;

          var hasX = typeof options.x === 'number';
          var hasY = typeof options.y === 'number';

          this.x = hasX ? options.x : randomBetween(0, Math.max(10, battlefieldRect.width - this.width));
          this.y = hasY ? options.y : randomBetween(0, Math.max(10, battlefieldRect.height - this.height));
          this.tx = this.x;
          this.ty = this.y;
          this.timeout = 0;

          var self = this;
          this.el.addEventListener('load', function () {
            self.width = self.el.width || self.el.naturalWidth || self.width;
            self.height = self.el.height || self.el.naturalHeight || self.height;
            self.refresh();
          });

          this.applyHue();
          this.pickNewTarget();
          this.refresh();
        }

        buildProps(extra) {
          var base = {
            grit: +randomBetween(0.3, 1).toFixed(2),
            morale: +randomBetween(0.3, 1).toFixed(2),
            volatility: +randomBetween(-0.5, 0.5).toFixed(2)
          };
          return Object.assign(base, extra || {});
        }

        applyHue() {
          var shadow = 'drop-shadow(0 3px 6px rgba(0,0,0,0.5))';
          this.el.style.filter = this.hue == null ? shadow : 'hue-rotate(' + this.hue + 'deg) saturate(1.4) ' + shadow;
        }

        pickNewTarget() {
          if (this.speed <= 0 || this.followMouse) return;
          this.timeout = 2000 + Math.random() * 3000;
          var pad = 20;
          refreshRect();
          this.tx = randomBetween(pad, Math.max(pad, battlefieldRect.width - pad));
          this.ty = randomBetween(pad, Math.max(pad, battlefieldRect.height - pad));
        }

        refresh() {
          this.el.style.left = Math.round(this.x) + 'px';
          this.el.style.top = Math.round(this.y) + 'px';
        }

        update(dt) {
          if (this.speed <= 0) return;
          if (this.followMouse) {
            this.tx = mouse.x;
            this.ty = mouse.y;
          } else {
            this.timeout -= dt;
          }

          var dx = this.tx - this.x;
          var dy = this.ty - this.y;
          var dist = Math.hypot(dx, dy) || 1;

          this.el.classList.toggle('face-left', dx < 0);

          if (!this.followMouse && (dist < 4 || this.timeout <= 0)) {
            this.pickNewTarget();
            return;
          }

          var step = this.speed * (dt / 1000);
          var nx = this.x + (dx / dist) * step;
          var ny = this.y + (dy / dist) * step;

          refreshRect();
          var w = this.el.width || this.width;
          var h = this.el.height || this.height;

          this.x = clamp(nx, 0, Math.max(0, battlefieldRect.width - w));
          this.y = clamp(ny, 0, Math.max(0, battlefieldRect.height - h));

          this.refresh();
        }
      }

      function spawnActor(config) {
        var actor = new BattlefieldActor(config);
        actors.push(actor);
        return actor;
      }

      function adoptActor(selector, config) {
        var el = battlefield.querySelector(selector);
        if (!el) return null;
        refreshRect();
        var rect = el.getBoundingClientRect();
        return spawnActor(Object.assign({
          el: el,
          x: rect.left - battlefieldRect.left,
          y: rect.top - battlefieldRect.top
        }, config || {}));
      }

      function spawnPaladin(options) {
        options = options || {};
        return spawnActor(Object.assign({
          type: 'paladin',
          className: 'unit paladin',
          src: 'images/New 2025/Paladin.webp',
          alt: 'Paladin'
        }, options));
      }

      window.spawnPaladin = spawnPaladin;

      function deployEntries(entries) {
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          if (entry.mode === 'adopt') {
            adoptActor(entry.selector, entry.config);
          } else if (entry.mode === 'paladin') {
            spawnPaladin(entry.config);
          } else {
            spawnActor(entry.config);
          }
        }
      }

      var roster = {
        civilians: [
          { mode: 'adopt', selector: '.villager', config: { type: 'villager', speed: 35 } }
        ],
        buildings: [
          { mode: 'adopt', selector: '.structure.outpost', config: { type: 'outpost', speed: 0 } },
          { mode: 'adopt', selector: '.landmark.temple', config: { type: 'temple', speed: 0 } },
        ],
        terrain: [
          { mode: 'adopt', selector: '.terrain.ocean', config: { type: 'ocean', speed: 0 } }
        ],
        military: [
          { mode: 'adopt', selector: '#teutonic', config: { type: 'teutonic', speed: 60 } },
          { mode: 'adopt', selector: '.frantic', config: { type: 'frantic', speed: 90 } },
          { mode: 'paladin', config: { x: 2600, y: 1700, speed: 90 } },
          { mode: 'paladin', config: { x: 1200, y: 1100, speed: 110, followMouse: true } },
          { mode: 'spawn', config: { type: 'camel', className: 'unit cavalry', src: 'images/New 2025/camel.gif', alt: 'Camel Rider', speed: 120 } },
          { mode: 'spawn', config: { type: 'cavalry', className: 'unit cavalry', src: 'images/New 2025/cavalry.gif', alt: 'Heavy Cavalry', speed: 135 } },
          { mode: 'spawn', config: { type: 'lancer', className: 'unit cavalry', src: 'images/New 2025/lancer.gif', alt: 'Lancer', speed: 125 } },
          { mode: 'spawn', config: { type: 'stoic', className: 'unit infantry', src: 'images/New 2025/stoic.gif', alt: 'Stoic Guard', speed: 70 } },
          { mode: 'spawn', config: { type: 'wolf', className: 'unit skirmisher', src: 'images/New 2025/wolf.webp', alt: 'War Wolf', speed: 140 } },
        ],
        siege: [
          { mode: 'adopt', selector: '.catapult', config: { type: 'catapult', speed: 20 } },
          { mode: 'spawn', config: { type: 'trebuchet', className: 'unit siege', src: 'images/New 2025/trebuchet.webp', alt: 'Trebuchet', speed: 15 } },
          { mode: 'spawn', config: { type: 'roller', className: 'unit siege', src: 'images/New 2025/roller.webp', alt: 'Siege Roller', speed: 18 } }
        ]
      };

      Object.keys(roster).forEach(function (group) {
        deployEntries(roster[group]);
      });

      function updateAll(dt) {
        for (var i = 0; i < actors.length; i++) {
          actors[i].update(dt);
        }
      }

      function loop(ts) {
        if (!lastTs) lastTs = ts;
        var dt = ts - lastTs;
        lastTs = ts;
        updateAll(dt);
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>

  <script>
    (function () {
      // Load the map image and set container to native size
      var mapContainer = document.querySelector('.map-arabia');
      if (mapContainer) {
        var mapImg = new Image();

          mapContainer.style.minWidth = mapImg.naturalWidth + 'px';

        };
        mapImg.src = 'images/aoe textures/MAP000.BMP';
      }
    })();

  <script>
    (function () {
      var alienmodeEl = document.getElementById('alienmode');
      if (!alienmodeEl) return;

      function showAlienmode() {
        // Fade in
        alienmodeEl.classList.add('show');
        
        // After fade in completes (1.5s) + visible time (2s), fade out
        setTimeout(function () {
          alienmodeEl.classList.remove('show');
        }, 3500);
      }

      // Show after 20 seconds, then schedule next appearance with random delay
      function scheduleNextAlienmode() {
        var delay = 20000 + Math.random() * 10000; // 20-30 seconds
        setTimeout(function () {
          showAlienmode();
          // Schedule the next one after this appearance finishes (5 seconds)
          setTimeout(scheduleNextAlienmode, 5000);
        }, delay);
      }

      // Start the first appearance after 20 seconds
      scheduleNextAlienmode();
    })();
  </script>

  <script src="sounds/goon2025/soundscape-files.js"></script>
  <script>
    (function () {
      var hudCount = document.getElementById('sound-count');
      var hudNow = document.getElementById('now-playing');
      var hudMode = document.getElementById('mode');
      var basePath = 'sounds/goon2025/Sounds/';

      function uniqueSorted(arr) {
        var seen = Object.create(null);
        var out = [];
        for (var i = 0; i < arr.length; i++) {
          var k = arr[i];
          if (!seen[k]) {
            seen[k] = true;
            out.push(k);
          }
        }
        out.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; });
        return out;
      }

      function buildPaths(names) {
        return names.map(function (n) { return basePath + n; });
      }

      function makePlayer(filePaths) {
        function sortByName(arr) {
          return arr.slice().sort(function (a, b) {
            var an = String(a).toLowerCase(), bn = String(b).toLowerCase();
            return an < bn ? -1 : an > bn ? 1 : 0;
          });
        }
        // Build master and categorized lists; prefer precomputed categories if available
        var all = sortByName(filePaths);
        var peacefulList = Array.isArray(window.SOUND_FILES_PEACEFUL) ? sortByName(window.SOUND_FILES_PEACEFUL) : all.slice();
        var warList = Array.isArray(window.SOUND_FILES_NONPEACEFUL) ? sortByName(window.SOUND_FILES_NONPEACEFUL) : all.slice();
        var ambienceList = Array.isArray(window.SOUND_FILES_AMBIENCE) ? sortByName(window.SOUND_FILES_AMBIENCE) : [];

        var isPeaceful = true;
        var files = isPeaceful ? peacefulList : warList;
        var idx = Math.floor(Math.random() * (files.length || 1));
        var ambIdx = Math.floor(Math.random() * (ambienceList.length || 1));

        function setMode(peace) {
          isPeaceful = !!peace;
          files = (isPeaceful ? peacefulList : warList);
          if (!files.length) files = all;
          idx = Math.floor(Math.random() * (files.length || 1));
          if (hudMode) hudMode.textContent = isPeaceful ? 'peaceful' : 'non-peaceful';
        }

        function scheduleFlip() {
          var delay = 20000 + Math.random() * 40000; // 20s - 60s
          setTimeout(function () {
            setMode(!isPeaceful);
            scheduleFlip();
          }, delay);
        }
        setMode(true);
        scheduleFlip();

        function chooseNext() {
          if (files.length === 0) return idx;
          var roll = Math.random();
          // 0.10 repeat same
          if (roll < 0.10) {
            return idx;
          }
          // Next alphabetical 0.15
          if (roll < 0.25) {
            return (idx + 1) % files.length;
          }
          // Otherwise random different
          var next = idx;
          if (files.length > 1) {
            while (next === idx) {
              next = Math.floor(Math.random() * files.length);
            }
          }
          return next;
        }

        function scheduleNext() {
          // Much more frequent, randomized cadence: 300ms - 3000ms
          var delayMs = 300 + Math.random() * 2700;
          setTimeout(playOnce, delayMs);
        }

        function playOnce() {
          // Randomize burst size: mostly 1-3, sometimes 4-5
          var r = Math.random();
          var burst = r < 0.6 ? 1 : r < 0.85 ? 2 : r < 0.95 ? 3 : r < 0.985 ? 4 : 5;
          for (var b = 0; b < burst; b++) {
            (function (offset) {
              setTimeout(function () {
                idx = chooseNext();
                var src = files[idx];
                hudNow.textContent = src.replace(basePath, '');
                var a = new Audio(src);
                // Slight volume variance to avoid monotony
                a.volume = 0.6 + Math.random() * 0.35; // 0.6 - 0.95
                a.play().catch(function () {
                  // Ignore autoplay errors; continue scheduling
                });
              }, offset);
            })(b * (80 + Math.random() * 220)); // 80-300ms between items in burst
          }
          // Schedule the next burst with new randomized interval
          scheduleNext();
        }

        // Ambience channel: always-on gentle background, independent of mode
        function scheduleAmbienceNext() {
          if (!ambienceList.length) return;
          var delayMs = 800 + Math.random() * 2600; // 0.8s - 3.4s
          setTimeout(playAmbienceOnce, delayMs);
        }

        function playAmbienceOnce() {
          if (!ambienceList.length) return;
          // small burst 1-2 layers
          var layers = Math.random() < 0.75 ? 1 : 2;
          for (var i = 0; i < layers; i++) {
            (function (offset) {
              setTimeout(function () {
                ambIdx = (ambIdx + 1) % ambienceList.length;
                var src = ambienceList[ambIdx];
                // Do not override the HUD with ambience every time; keep battlefield SFX priority
                var a = new Audio(src);
                a.volume = 0.25 + Math.random() * 0.2; // 0.25 - 0.45 softer bed
                a.play().catch(function () {});
              }, offset);
            })(i * (200 + Math.random() * 300));
          }
          scheduleAmbienceNext();
        }

        hudCount.textContent = all.length.toString();
        scheduleNext();
        scheduleAmbienceNext();
      }

      var fromFile = Array.isArray(window.SOUND_FILES) ? window.SOUND_FILES.slice() : [];
      if (fromFile.length) {
        makePlayer(fromFile);
      } else {
        makePlayer([]);
      }
    })();
  </script>

  <script>
  (function () {
    var TARGET  = 0.4;
    var FADE_MS = 7000;
    var XFADE_S = 1.2;

    var tracks = [];
    for (var i = 0; ; i++) {
      var el = document.getElementById('bgT' + i);
      if (!el) break;
      tracks.push(el);
    }
    if (!tracks.length) return;

    var btn       = document.getElementById('bgAudioToggle');
    var cur       = 0;
    var playing   = false;
    var userMuted = false;
    var fadeRaf   = null;

    tracks.forEach(function (t) { t.volume = 0; t.loop = false; });

    function fadeTo(track, toVol, ms) {
      cancelAnimationFrame(fadeRaf);
      var t0 = performance.now(), v0 = track.volume;
      (function step(now) {
        var p = Math.min((now - t0) / ms, 1);
        track.volume = v0 + (toVol - v0) * p;
        if (p < 1) fadeRaf = requestAnimationFrame(step);
      })(performance.now());
    }

    // Fade out near end of each track, then hand off to the next
    tracks.forEach(function (t, idx) {
      t.addEventListener('timeupdate', function () {
        if (userMuted || !t.duration || idx !== cur) return;
        var rem = t.duration - t.currentTime;
        if (rem > 0 && rem < XFADE_S) t.volume = TARGET * (rem / XFADE_S);
      });
      t.addEventListener('ended', function () {
        if (idx !== cur) return;
        t.pause(); t.currentTime = 0; t.volume = 0;
        cur = (cur + 1) % tracks.length;
        tracks[cur].currentTime = 0; tracks[cur].volume = 0;
        tracks[cur].play().catch(function () {});
        fadeTo(tracks[cur], TARGET, FADE_MS);
      });
    });

    // Pick a uniformly random position across the combined timeline of all tracks
    function applyRandomSeek() {
      var durs = tracks.map(function (t) { return t.duration; });
      if (durs.some(function (d) { return !isFinite(d) || d <= 0; })) {
        console.warn('[bgAudio] duration not finite, skipping seek:', durs);
        return;
      }
      var total = durs.reduce(function (a, b) { return a + b; }, 0);
      var rand = Math.random() * total, acc = 0;
      for (var j = 0; j < durs.length; j++) {
        acc += durs[j];
        if (rand < acc) {
          var seekTo = rand - (acc - durs[j]);
          console.log('[bgAudio] → track ' + j + ' at ' + seekTo.toFixed(1) + 's / ' + durs[j].toFixed(1) + 's');
          if (j !== cur) {
            tracks[cur].pause(); tracks[cur].volume = 0;
            cur = j; tracks[cur].volume = 0;
            tracks[cur].play().catch(function () {});
            fadeTo(tracks[cur], TARGET, FADE_MS);
          }
          tracks[cur].currentTime = seekTo;
          return;
        }
      }
    }

    // Call cb once every track has a real finite duration
    function onAllDurations(cb) {
      var done = false;
      var ready = tracks.map(function () { return false; });
      tracks.forEach(function (t, idx) {
        function check() {
          if (done || ready[idx]) return;
          if (isFinite(t.duration) && t.duration > 0) {
            ready[idx] = true;
            if (ready.every(Boolean)) { done = true; cb(); }
          }
        }
        t.addEventListener('loadedmetadata', check);
        t.addEventListener('durationchange', check);
        check(); // already ready?
      });
    }

    function startPlayback() {
      if (playing) return;
      playing = true;
      tracks[0].volume = 0;
      tracks[0].play().catch(function (e) {
        console.warn('[bgAudio] play failed:', e.message);
        playing = false; // allow retry
      });
      fadeTo(tracks[0], TARGET, FADE_MS);
      onAllDurations(applyRandomSeek);
    }

    // Start on any first interaction (click, key, scroll)
    function onInteract() {
      startPlayback();
      ['click','keydown','touchstart'].forEach(function (ev) {
        document.removeEventListener(ev, onInteract);
      });
    }
    ['click','keydown','touchstart'].forEach(function (ev) {
      document.addEventListener(ev, onInteract);
    });

    // Also attempt autoplay (succeeds on repeat visits where the site has media permission)
    tracks[0].play().then(function () {
      if (!playing) {
        playing = true;
        fadeTo(tracks[0], TARGET, FADE_MS);
        onAllDurations(applyRandomSeek);
      }
    }).catch(function () { /* blocked — onInteract handles it */ });

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      startPlayback();
      var t = tracks[cur];
      if (!t.paused) {
        userMuted = true;
        cancelAnimationFrame(fadeRaf);
        t.pause(); t.volume = 0;
        btn.textContent = '♪ OFF';
        btn.classList.add('muted');
      } else {
        userMuted = false;
        t.play().catch(function () {});
        fadeTo(t, TARGET, FADE_MS);
        btn.textContent = '♪ BG';
        btn.classList.remove('muted');
      }
    });
  })();
  </script>
</body>
</html>
