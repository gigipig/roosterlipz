<!DOCTYPE html>
<html>
<head>
    <title>Ancestral Diets Map - Leaflet Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }
        
        .legend {
            line-height: 18px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize the map
        const map = L.map('map').setView([20, 0], 2);

        // Add base map tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        // Load diet data (you'll need to host these files or load them appropriately)
        Promise.all([
            fetch('ancestral_regions_final.geojson').then(r => r.json()),
            fetch('ancestral_diets_geo_final.json').then(r => r.json())
        ]).then(([geojson, dietData]) => {
            
            // Create a lookup for diet data
            const dietLookup = {};
            dietData.cultures.forEach(culture => {
                dietLookup[culture.id] = culture;
            });

            // Color scale function based on lactase persistence
            function getColor(lactasePercent) {
                return lactasePercent > 70 ? '#005a32' :
                       lactasePercent > 50 ? '#238b45' :
                       lactasePercent > 30 ? '#74c476' :
                       lactasePercent > 15 ? '#bae4b3' :
                       lactasePercent > 5  ? '#edf8e9' :
                                              '#f7f7f7';
            }

            // Style function for each feature
            function style(feature) {
                const diet = dietLookup[feature.properties.id];
                const lactasePercent = diet?.genetic_adaptations?.lactase_persistence?.allele_frequency_percent || 0;
                
                return {
                    fillColor: getColor(lactasePercent),
                    weight: 1,
                    opacity: 1,
                    color: 'white',
                    dashArray: '3',
                    fillOpacity: 0.7
                };
            }

            // Highlight feature on hover
            function highlightFeature(e) {
                const layer = e.target;
                layer.setStyle({
                    weight: 3,
                    color: '#666',
                    dashArray: '',
                    fillOpacity: 0.9
                });
                layer.bringToFront();
                info.update(layer.feature.properties);
            }

            function resetHighlight(e) {
                geojsonLayer.resetStyle(e.target);
                info.update();
            }

            function zoomToFeature(e) {
                map.fitBounds(e.target.getBounds());
            }

            function onEachFeature(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: zoomToFeature
                });
            }

            // Add GeoJSON layer to map
            const geojsonLayer = L.geoJSON(geojson, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);

            // Info control
            const info = L.control();

            info.onAdd = function (map) {
                this._div = L.DomUtil.create('div', 'info');
                this.update();
                return this._div;
            };

            info.update = function (props) {
                if (props) {
                    const diet = dietLookup[props.id];
                    const lactase = diet?.genetic_adaptations?.lactase_persistence?.allele_frequency_percent || 0;
                    this._div.innerHTML = '<h4>Ancestral Diet Region</h4>' +
                        '<b>' + props.name + '</b><br />' +
                        'Culture: ' + (diet?.culture || 'N/A') + '<br />' +
                        'Lactase Persistence: ' + lactase + '%<br />' +
                        'Diet: ' + (diet?.diet_signature || 'N/A').substring(0, 100) + '...';
                } else {
                    this._div.innerHTML = '<h4>Ancestral Diet Regions</h4>Hover over a region';
                }
            };

            info.addTo(map);

            // Legend
            const legend = L.control({position: 'bottomright'});

            legend.onAdd = function (map) {
                const div = L.DomUtil.create('div', 'info legend');
                const grades = [0, 5, 15, 30, 50, 70];
                const labels = [];

                div.innerHTML = '<h4>Lactase Persistence %</h4>';
                
                for (let i = 0; i < grades.length; i++) {
                    div.innerHTML +=
                        '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                        grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '%<br>' : '+%');
                }
                return div;
            };

            legend.addTo(map);
        });
    </script>
</body>
</html>
