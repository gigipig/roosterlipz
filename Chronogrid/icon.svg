<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#0a0a0f"/>
  <!-- Outer glow ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="96" cy="96" r="56" fill="none" stroke="#4488ff" stroke-width="0.5" opacity="0.2"/>
  <!-- Grid lines -->
  <line x1="96" y1="36" x2="96" y2="156" stroke="#44ff88" stroke-width="1" opacity="0.4"/>
  <line x1="36" y1="96" x2="156" y2="96" stroke="#44ff88" stroke-width="1" opacity="0.4"/>
  <!-- Glowing orb -->
  <radialGradient id="orbGrad" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="30%" stop-color="#88ccff" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#4488ff" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
  </radialGradient>
  <circle cx="96" cy="96" r="32" fill="url(#orbGrad)"/>
  <!-- Orb border glow -->
  <circle cx="96" cy="96" r="32" fill="none" stroke="#4488ff" stroke-width="2" opacity="0.8"/>
  <circle cx="96" cy="96" r="34" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <circle cx="96" cy="96" r="36" fill="none" stroke="#4488ff" stroke-width="0.5" opacity="0.2"/>
  <!-- CG text -->
  <text x="96" y="88" font-family="monospace" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CG</text>
  <text x="96" y="108" font-family="monospace" font-size="7" fill="#44ff88" text-anchor="middle" letter-spacing="3" opacity="0.9">CHRONO</text>
</svg>
