    <script>
        const canvas = document.getElementById('rain');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fontSize = 14;
        const columns = Math.floor(canvas.width / (fontSize * 0.6));

        // Raindrops array
        const raindrops = [];

        class Raindrop {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -500;
                this.speed = Math.random() * 3 + 2;
                this.length = Math.floor(Math.random() * 15) + 10;
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update() {
                this.y += this.speed;
                
                // Reset raindrop when it goes off screen
                if (this.y > canvas.height) {
                    this.y = Math.random() * -200;
                    this.x = Math.random() * canvas.width;
                    this.speed = Math.random() * 3 + 2;
                    this.length = Math.floor(Math.random() * 15) + 10;
                }
            }

            draw() {
                ctx.font = fontSize + 'px monospace';
                
                for (let i = 0; i < this.length; i++) {
                    const charY = this.y + (i * fontSize * 0.8);
                    
                    if (charY > 0 && charY < canvas.height) {
                        // Calculate opacity based on position in the raindrop
                        const fadeFactor = 1 - (i / this.length);
                        const alpha = this.opacity * fadeFactor;
                        
                        // Blue color gradient
                        if (i === 0) {
                            ctx.fillStyle = `rgba(200, 230, 255, ${alpha * 1.5})`; // Bright tip
                        } else {
                            ctx.fillStyle = `rgba(100, 150, 255, ${alpha})`;
                        }
                        
                        ctx.fillText('|', this.x, charY);
                    }
                }
            }
        }

        // Create initial raindrops
        for (let i = 0; i < 200; i++) {
            raindrops.push(new Raindrop());
        }

        function animate() {
            // Clear with slight transparency for trail effect
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw raindrops
            raindrops.forEach(drop => {
                drop.update();
                drop.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
